[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repoheal"
version = "0.1.0"
description = "Autonomous repository analysis & self-healing AI engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "REPO-HEAL contributors" }]
keywords = ["ai", "static-analysis", "code-intelligence", "knowledge-graph", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "structlog>=24.1",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "networkx>=3.2",
  "pathspec>=0.12",
  "tree-sitter>=0.21",
  "tree-sitter-languages>=1.10",
  "anyio>=4.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.4",
  "black>=24.4",
  "mypy>=1.10",
  "types-networkx",
  "pre-commit>=3.7",
]
ml = [
  "sentence-transformers>=2.7",
  "faiss-cpu>=1.8",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
]
neo4j = ["neo4j>=5.20"]
postgres = ["asyncpg>=0.29", "sqlalchemy>=2.0"]

[project.scripts]
repoheal = "repoheal.cli:app"

[project.urls]
Homepage = "https://github.com/syedmahran404/REPO-HEAL"
Documentation = "https://github.com/syedmahran404/REPO-HEAL/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repoheal = ["py.typed", "intelligence/queries/*.scm"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # isort
  "B",                # bugbear
  "UP",               # pyupgrade
  "SIM",              # simplify
  "C4",               # comprehensions
  "RET",              # returns
  "RUF",              # ruff-specific
]
ignore = [
  "E501",  # line length handled by black
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Calls used as defaults in function signatures that are NOT mutable.
# pydantic.Field and typer.Option are the canonical idioms.
extend-immutable-calls = [
  "pydantic.Field",
  "typer.Option",
  "typer.Argument",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src/repoheal"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=repoheal",
  "--cov-report=term-missing",
  "--cov-report=xml",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:tree_sitter.*",
  "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.coverage.run]
source = ["src/repoheal"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@overload",
]
